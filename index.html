<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل بيانات المبيعات</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { text-align: center; color: #2c3e50; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .chart-container {
            background: #fff;
            padding: 20px;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9em;
        }
        th, td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:hover { background-color: #f1f1f1; }
        .total-row {
            background-color: #ecf0f1;
            font-weight: bold;
            color: #2980b9;
        }
        .loading { text-align: center; font-size: 1.2em; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحليل مبيعات الفرق</h1>
    
    <div id="loading" class="loading">جاري جلب البيانات من GitHub...</div>

    <div class="stats-grid">
        <div class="chart-container">
            <canvas id="salesChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="qtyChart"></canvas>
        </div>
    </div>

    <div style="overflow-x:auto;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>الفريق (Team)</th>
                    <th>اسم الصنف (Item Name)</th>
                    <th>قيمة المبيعات</th>
                    <th>الكمية</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // استبدل هذا الرابط برابط الـ Raw CSV الخاص بك من GitHub
    const csvUrl = 'https://raw.githubusercontent.com/username/repo/main/data.csv';

    async function fetchData() {
        try {
            const response = await fetch(csvUrl);
            const csvData = await response.text();
            
            Papa.parse(csvData, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processAndDisplay(results.data);
                    document.getElementById('loading').style.display = 'none';
                }
            });
        } catch (error) {
            document.getElementById('loading').innerText = "خطأ في تحميل البيانات. تأكد من رابط GitHub.";
            console.error(error);
        }
    }

    function processAndDisplay(data) {
        const tableBody = document.querySelector('#dataTable tbody');
        const teamTotals = {};
        const teamQty = {};

        data.forEach(row => {
            // تنظيف البيانات (إزالة الفواصل لتحويلها لأرقام)
            const salesVal = parseFloat(row['Sales Value']?.replace(/,/g, '')) || 0;
            const qtyVal = parseFloat(row['Qty']?.replace(/,/g, '')) || 0;
            const team = row['Team']?.trim();

            // إضافة صف للجدول
            const tr = document.createElement('tr');
            if (!row['Item Name'] || row['Item Name'].trim() === "") {
                tr.className = 'total-row';
            }
            
            tr.innerHTML = `
                <td>${team || ''}</td>
                <td>${row['Item Name'] || 'إجمالي الفريق'}</td>
                <td>${salesVal.toLocaleString()}</td>
                <td>${qtyVal.toLocaleString() || '-'}</td>
            `;
            tableBody.appendChild(tr);

            // تجميع بيانات الرسم البياني (تجاهل صفوف الإجمالي الكلي)
            if (team && team !== "Grand Total" && row['Item Name'] && row['Item Name'].trim() !== "") {
                teamTotals[team] = (teamTotals[team] || 0) + salesVal;
                teamQty[team] = (teamQty[team] || 0) + qtyVal;
            }
        });

        renderCharts(teamTotals, teamQty);
    }

    function renderCharts(salesData, qtyData) {
        const labels = Object.keys(salesData);
        
        // رسم بياني للمبيعات
        new Chart(document.getElementById('salesChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'إجمالي قيمة المبيعات حسب الفريق',
                    data: Object.values(salesData),
                    backgroundColor: '#3498db'
                }]
            },
            options: { responsive: true, plugins: { legend: { labels: { font: { family: 'Tajawal' } } } } }
        });

        // رسم بياني للكميات
        new Chart(document.getElementById('qtyChart'), {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    label: 'توزيع الكميات',
                    data: Object.values(qtyData),
                    backgroundColor: ['#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#1abc9c', '#34495e', '#e67e22']
                }]
            },
            options: { responsive: true }
        });
    }

    fetchData();
</script>

</body>
</html>
